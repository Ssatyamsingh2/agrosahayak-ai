<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crop Disease Detection — AgroSahayak AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="logo">🌾 AgroSahayak AI</a>
    <nav class="main-nav">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="disease.html" data-i18n="nav_disease">Disease Detection</a>
      <a href="shops.html" data-i18n="nav_shops">Shop Finder</a>
      <a href="schemes.html" data-i18n="nav_schemes">Govt. Schemes</a>
    </nav>
    <div class="lang-switcher" aria-label="Language selector">
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="hi">हिंदी</button>
      <button class="lang-btn" data-lang="hry">हरियाणवी</button>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title" data-i18n="disease_title">Crop Disease Detection</h1>
    <p class="page-subtitle" data-i18n="disease_subtitle">Upload a clear photo of the affected leaf or crop.</p>

    <div class="panel">
      <div class="form-row">
        <input type="file" id="image-input" accept="image/*" data-i18n-placeholder="upload_label" />
        <button class="btn" id="analyze-btn" data-i18n="analyze_btn">Analyze</button>
      </div>

      <div id="preview-wrap">
        <img id="image-preview" alt="Selected crop image preview" />
      </div>

      <div id="result" class="result-card">
        <h3 id="result-disease-name"></h3>
        <p id="result-description"></p>
        <p><strong id="result-remedy-label"></strong> <span id="result-remedy"></span></p>
        <p class="confidence" id="result-confidence"></p>
        <button class="btn secondary" id="listen-btn" data-i18n="listen_btn">🔊 Listen</button>
      </div>
    </div>

    <p class="notice" data-i18n="disease_disclaimer">
      This is a demo classifier for portfolio purposes. It is not a substitute for expert agronomic advice.
    </p>
  </main>

  <footer class="app-footer">
    <p data-i18n="footer_text">Built for farmers, in their language.</p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/disease.js"></script>
</body>
</html>
