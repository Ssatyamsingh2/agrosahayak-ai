<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroSahayak AI — Farming Assistant</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="logo">🌾 <span>AgroSahayak AI</span></div>
    <nav class="lang-switcher" aria-label="Language selector">
      <button class="lang-btn active" data-lang="en">English</button>
      <button class="lang-btn" data-lang="hi">हिंदी</button>
      <button class="lang-btn" data-lang="hry">हरियाणवी</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-i18n="hero_title">Your Farming Companion</h1>
      <p data-i18n="hero_subtitle">Ask questions about crops, weather, and farming practices — in your own language.</p>
    </section>

    <section class="chat-panel" aria-label="Farming assistant chat">
      <div id="chat-window" class="chat-window">
        <div class="message bot">
          <p data-i18n="welcome_msg">Namaste! How can I help you with your farm today?</p>
        </div>
      </div>

      <form id="chat-form" class="chat-input-row">
        <input
          type="text"
          id="chat-input"
          data-i18n-placeholder="input_placeholder"
          placeholder="Type your question here..."
          autocomplete="off"
        />
        <button type="button" id="mic-btn" class="icon-btn" aria-label="Speak your question">🎤</button>
        <button type="submit" class="icon-btn primary" aria-label="Send">➤</button>
      </form>
    </section>
  </main>

  <footer class="app-footer">
    <p data-i18n="footer_text">Built for farmers, in their language.</p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
