<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fertilizer Shop Finder — AgroSahayak AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="logo">🌾 AgroSahayak AI</a>
    <nav class="main-nav">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="disease.html" data-i18n="nav_disease">Disease Detection</a>
      <a href="shops.html" data-i18n="nav_shops">Shop Finder</a>
      <a href="schemes.html" data-i18n="nav_schemes">Govt. Schemes</a>
    </nav>
    <div class="lang-switcher" aria-label="Language selector">
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="hi">हिंदी</button>
      <button class="lang-btn" data-lang="hry">हरियाणवी</button>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title" data-i18n="shops_title">Fertilizer Shop Finder</h1>
    <p class="page-subtitle" data-i18n="shops_subtitle">Find agriculture input shops near you.</p>

    <p class="notice" data-i18n="shops_notice">
      Showing sample shop data for demo purposes. Live results require a Google Places API connection.
    </p>

    <div class="panel">
      <div class="form-row">
        <input type="text" id="location-input" data-i18n-placeholder="location_placeholder" placeholder="Enter your village or city" />
        <button class="btn secondary" id="use-location-btn" data-i18n="use_location_btn">📍 Use my location</button>
        <button class="btn" id="search-btn" data-i18n="search_btn">Search</button>
      </div>

      <div id="shop-results"></div>
    </div>
  </main>

  <footer class="app-footer">
    <p data-i18n="footer_text">Built for farmers, in their language.</p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/shops.js"></script>
</body>
</html>
